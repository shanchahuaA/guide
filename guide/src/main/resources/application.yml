spring:
  application:
    name: guide
  profiles:
    include: local
  devtools:
    restart:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ""
    # 账号和密码在 application-local.yml 里覆盖
    username: ""
    password: ""
  data:
    redis:
      # 命令超时。不设这一条时用的是 lettuce 的默认值（1 分钟），于是 Redis 运行中掉线后，
      # ItemCache.getAll() 里那个"读缓存失败就回源 MySQL"的 catch 要等一分钟才拿到控制权 ——
      # 降级路径是对的，但请求已经挂住了。
      #
      # 一次请求要卡**两次**：先读（未命中/失败）再回填写，两次都等满这个超时，实测 1 分钟 × 2
      # = 120s。所以这里给 500ms 时每个请求约 1s（验收口径是"停掉 Redis 后 2 秒内返回"）。
      # 本机 Redis 正常响应 8ms，500ms 已是 60 倍余量，够不着正常的慢查询。
      timeout: 500ms
      # 建连超时。掉线后要建新连接，不设则按 lettuce 默认等 10s；
      # 端口不通时本机是秒拒，这一条只兜住"连得上但迟迟不响应"的情形。
      connect-timeout: 1s

server:
  port:

mybatis-plus:
  # 1. 找Mapper.xml文件（和原生mybatis作用一样）
  mapper-locations: classpath:mapper/*.xml
  # 2. 实体类别名包
  type-aliases-package: org.example.guide.pojo
  configuration:
    # 打印SQL日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 数据库下划线字段 → java驼峰属性
    map-underscore-to-camel-case: true

guide:
  wechat:
    # 小程序登录（/api/auth/login 调 code2Session 换 openid）用的 appid / secret。
    # 仓库里只给空占位：真值放已 gitignore 的 application-local.yml，别提交进仓库
    appid: ""
    secret: ""
  # 用户上传的头像（个人页，POST /api/teach/avatar）。与 icon-* 同理：
  # 目录相对后端进程的工作目录（从 guide/ 启动 → guide/avatars/），该目录进 .gitignore
  avatar-dir: avatars
  avatar-url-prefix: /avatars
  # 图鉴图标。采集是应用**外面**的脚本（guide/tools/crawl_items.py），
  # 它按 GUIDE_ICON_DIR 往这里落盘（默认同一个目录）；后端只负责把目录暴露成 URL
  # 目录相对后端进程的工作目录（从 guide/ 启动 → guide/icons/），图标随仓库发布
  icon-dir: icons
  # 图标对外的 URL 前缀，与 WebMvcConfig 的静态资源映射、条目 icon 列三处保持一致
  icon-url-prefix: /icons
  ai:
    # DeepSeek 走 OpenAI 兼容的 POST /chat/completions（契约 §7）
    base-url: https://api.deepseek.com
    model: deepseek-flash
    # 关掉时 /api/teach/ask 返回预置文案而不是报错（契约 §7.0），演示与无 Key 的机器都能跑
    # 注意：调用用的是**用户自己的** Key（落 user.api_key 列），这里没有、也不该有服务端 Key
    enabled: true
