spring:
  application:
    name: guide
  profiles:
    include: local
  devtools:
    restart:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ""
    # 账号和密码在 application-local.yml 里覆盖
    username: ""
    password: ""

server:
  port:

mybatis-plus:
  # 1. 找Mapper.xml文件（和原生mybatis作用一样）
  mapper-locations: classpath:mapper/*.xml
  # 2. 实体类别名包
  type-aliases-package: org.example.guide.pojo
  configuration:
    # 打印SQL日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 数据库下划线字段 → java驼峰属性
    map-underscore-to-camel-case: true
